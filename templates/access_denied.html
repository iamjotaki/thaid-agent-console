<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied · ThaiD Agent Console</title>
    <link rel="icon" href="https://thaid.online/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] text-stone-900 h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-black/[0.08] p-8 text-center space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto shadow-inner">
            🛡️
        </div>
        <h1 class="text-xl font-bold text-stone-900">พื้นที่จำกัดสิทธิ์เฉพาะ Super Admin</h1>
        <p class="text-xs text-stone-600 leading-relaxed">
            ระบบ ThaiD Agent Web Console เป็นเครื่องมือควบคุมระดับเซิร์ฟเวอร์ (Server Infrastructure)<br>
            สงวนสิทธิ์การเข้าถึงเฉพาะบัญชีผู้ดูแลระบบสูงสุด (<span class="font-bold text-stone-800">iamjotaki@gmail.com</span>) เท่านั้น
        </p>
        <div class="pt-4 space-y-2">
            <a href="https://thaid.online" class="block w-full py-2.5 px-4 rounded-2xl bg-stone-900 hover:bg-black text-white text-xs font-semibold shadow-xs transition">
                กลับสู่หน้าหลัก ThaiD.online
            </a>
            <button onclick="logout()" class="block w-full py-2 px-4 rounded-xl text-stone-500 hover:text-stone-700 text-xs transition">
                สลับบัญชีเข้าสู่ระบบ
            </button>
        </div>
    </div>
    <script>
        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'https://thaid.online/api/auth/google?from=https://agent.thaid.online';
        }
    </script>
</body>
</html>
